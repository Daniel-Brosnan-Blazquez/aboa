   height="720"
   viewBox="0 0 1200 720"
   role="img"
   aria-labelledby="title desc"
   version="1.1"
   id="svg35"
   sodipodi:docname="aboa_retrieve_operation_flow.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview35"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.89166667"
     inkscape:cx="653.83178"
     inkscape:cy="368.41121"
     inkscape:window-width="1920"
     inkscape:window-height="1011"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg35" />
  <title
     id="title">ABOA retrieve operation flow</title>
  <desc
     id="desc">High-level schematic for querying archived files, optional copy-out retrieval, access-date updates, and retrieval failure recording.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#5b6472"
         id="path1" />
    </marker>
    <style
       id="style1">
      .bg { fill: #f7f9fc; }
      .title { fill: #1f2937; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #5b6472; font: 400 15px Arial, sans-serif; }
      .step { fill: #ffffff; stroke: #9aa7b5; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fff8e6; stroke: #d6a84f; stroke-width: 1.5; }
      .data { fill: #eef5ff; stroke: #5b8fd6; stroke-width: 1.5; rx: 8; }
      .success { fill: #ecfdf3; stroke: #4f9d69; stroke-width: 1.5; rx: 8; }
      .failure { fill: #fff1f1; stroke: #d46a6a; stroke-width: 1.5; rx: 8; }
      .boxtext { fill: #1f2937; font: 700 15px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #374151; font: 400 13px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #5b6472; font: 700 12px Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #5b6472; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b98a8; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect
     class="bg"
     width="1200"
     height="720"
     id="rect1" />
  <text
     class="title"
     x="60"
     y="62"
     id="text1">Retrieve operation flow</text>
  <text
     class="subtitle"
     x="60"
     y="88"
     id="text2">Retrieval selects archive rows, optionally copies payloads out, and always refreshes access timestamps on success.</text>
  <g
     id="main-flow">
    <rect
       class="step"
       x="70"
       y="150"
       width="190"
       height="78"
       id="rect2" />
    <text
       class="boxtext"
       x="165"
       y="180"
       id="text3">Build query filters</text>
    <text
       class="small"
       x="165"
       y="200"
       id="text4">caller or CLI args</text>
    <rect
       class="data"
       x="330"
       y="150"
       width="210"
       height="78"
       id="rect4" />
    <text
       class="boxtext"
       x="435"
       y="180"
       id="text5">Query archived_files</text>
    <text
       class="small"
       x="435"
       y="200"
       id="text6">filter, group, order, page</text>
    <polygon
       class="decision"
       points="690,138 800,189 690,240 580,189"
       id="polygon6" />
    <text
       class="boxtext"
       x="690"
       y="185"
       id="text7">Grouped</text>
    <text
       class="small"
       x="690"
       y="205"
       id="text8">response?</text>
    <rect
       class="step"
       x="870"
       y="150"
       width="230"
       height="78"
       id="rect8" />
    <text
       class="boxtext"
       x="985"
       y="180"
       id="text9">Keep response shape</text>
    <text
       class="small"
       x="985"
       y="200"
       id="text10">flatten only for bookkeeping</text>
    <path
       class="arrow"
       d="M 260 189 H 321"
       id="path10" />
    <path
       class="arrow"
       d="M 540 189 H 580"
       id="path11" />
    <path
       class="arrow"
       d="M 800 189 H 861"
       id="path12" />
  </g>
  <g
     id="copy-flow">
    <polygon
       class="decision"
       points="165,318 275,370 165,422 55,370"
       id="polygon12" />
    <text
       class="boxtext"
       x="165"
       y="366"
       id="text12">Destination</text>
    <text
       class="small"
       x="165"
       y="386"
       id="text13">provided?</text>
    <rect
       class="step"
       x="360"
       y="330"
       width="230"
       height="80"
       id="rect13" />
    <text
       class="boxtext"
       x="475"
       y="360"
       id="text14">Prepare destination</text>
    <text
       class="small"
       x="475"
       y="380"
       id="text15">create directory</text>
    <rect
       class="step"
       x="660"
       y="330"
       width="230"
       height="80"
       id="rect15" />
    <text
       class="boxtext"
       x="775"
       y="360"
       id="text16">Verify payloads</text>
    <text
       class="small"
       x="775"
       y="380"
       id="text17">selected archive files exist</text>
    <rect
       class="step"
       x="960"
       y="330"
       width="190"
       height="80"
       id="rect17" />
    <text
       class="boxtext"
       x="1055"
       y="360"
       id="text18">Copy payloads</text>
    <text
       class="small"
       x="1055"
       y="380"
       id="text19">do not overwrite</text>
    <path
       class="arrow"
       d="M 690 240 C 690 288 165 286 165 309"
       id="path19" />
    <path
       class="arrow"
       d="M 275 370 H 351"
       id="path20" />
    <path
       class="arrow"
       d="M 590 370 H 651"
       id="path21" />
    <path
       class="arrow"
       d="M 890 370 H 951"
       id="path22" />
    <path
       class="arrow"
       d="M 165 422 V 530 H 352"
       id="path23" />
  </g>
  <g
     id="commit-flow">
    <rect
       class="data"
       x="360"
       y="515"
       width="230"
       height="84"
       id="rect23" />
    <text
       class="boxtext"
       x="475"
       y="548"
       id="text23">Set last_access_date</text>
    <text
       class="small"
       x="475"
       y="570"
       id="text24">current UTC for selected rows</text>
    <rect
       class="success"
       x="690"
       y="515"
       width="180"
       height="84"
       id="rect24" />
    <text
       class="boxtext"
       x="780"
       y="548"
       id="text25">Commit</text>
    <text
       class="small"
       x="780"
       y="570"
       id="text26">transaction</text>
    <rect
       class="success"
       x="970"
       y="515"
       width="180"
       height="84"
       id="rect26" />
    <text
       class="boxtext"
       x="1060"
       y="548"
       id="text27">Return rows</text>
    <text
       class="small"
       x="1060"
       y="570"
       id="text28">grouped or flat shape</text>
    <path
       class="arrow"
       d="m 1055,410 c 0.3292,69.20983 -538.33568,-39.99438 -580,96"
       id="path28"
       sodipodi:nodetypes="cc" />
    <path
       class="arrow"
       d="M 590 557 H 681"
       id="path29" />
    <path
       class="arrow"
       d="M 870 557 H 961"
       id="path30" />
  </g>
  <g
     id="failure-flow">
    <rect
       class="failure"
       x="70"
       y="625"
       width="1060"
       height="56"
       id="rect30" />
    <text
       class="boxtext"
       x="600"
       y="649"
       id="text30">Failure path: roll back partial changes, record RETRIEVE_FAILED, commit failure row, raise ArchiveRetrievalError.</text>
    <path
       class="dash"
       d="M 435 228 C 418 330 258 420 170 616"
       id="path31" />
    <path
       class="dash"
       d="M 775,410 C 216.09769,434.37033 320.244,570.87771 315,616"
       id="path32"
       sodipodi:nodetypes="cc" />
    <path
       class="dash"
       d="M 1055,410 C 953.60587,491.48466 926.33024,424.2663 891.16822,626.09346"
       id="path33"
       sodipodi:nodetypes="cc" />
  </g>
  <text
     class="label"
     x="830"
     y="178"
     id="text33">yes</text>
  <text
     class="label"
     x="179.21495"
     y="436.34579"
     id="text34"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, sans-serif">no</text>
  <text
     class="label"
     x="302"
     y="358"
     id="text35">yes</text>
</svg>
