  <sodipodi:namedview
     id="namedview32"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.89166667"
     inkscape:cx="600"
     inkscape:cy="359.43925"
     inkscape:window-width="1920"
     inkscape:window-height="1011"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg32" />
  <title
     id="title">ABOA physical deletion and trash flow</title>
  <desc
     id="desc">High-level schematic for moving archived payloads into the trash directory and queueing final removal.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#5b6472"
         id="path1" />
    </marker>
    <style
       id="style1">
      .bg { fill: #f7f9fc; }
      .title { fill: #1f2937; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #5b6472; font: 400 15px Arial, sans-serif; }
      .step { fill: #ffffff; stroke: #9aa7b5; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fff8e6; stroke: #d6a84f; stroke-width: 1.5; }
      .data { fill: #eef5ff; stroke: #5b8fd6; stroke-width: 1.5; rx: 8; }
      .success { fill: #ecfdf3; stroke: #4f9d69; stroke-width: 1.5; rx: 8; }
      .boxtext { fill: #1f2937; font: 700 15px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #374151; font: 400 13px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #5b6472; font: 700 12px Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #5b6472; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b98a8; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect
     class="bg"
     width="1200"
     height="720"
     id="rect1" />
  <path
     d="m 352.09346,618.92523 h 81"
     style="fill:none;stroke:#5b6472;stroke-width:2;marker-end:url(#arrow)"
     id="path1-6" />
  <text
     class="title"
     x="60"
     y="62"
     id="text1">Physical deletion and trash flow</text>
  <text
     class="subtitle"
     x="60"
     y="88"
     id="text2">Physical deletion keeps inventory while moving payloads into a managed trash queue for later final removal.</text>
  <g
     id="main-flow">
    <polygon
       class="decision"
       points="165,145 285,205 165,265 45,205"
       id="polygon2" />
    <text
       class="boxtext"
       x="165"
       y="201"
       id="text3">Payload at</text>
    <text
       class="small"
       x="165"
       y="221"
       id="text4">archive path?</text>
    <rect
       class="step"
       x="365"
       y="164"
       width="250"
       height="82"
       id="rect4" />
    <text
       class="boxtext"
       x="490"
       y="196"
       id="text5">Calculate final removal</text>
    <text
       class="small"
       x="490"
       y="216"
       id="text6">logical removal date plus</text>
    <text
       class="small"
       x="490"
       y="234"
       id="text7">FINAL_REMOVAL_DELAY_DAYS</text>
    <rect
       class="step"
       x="700"
       y="164"
       width="250"
       height="82"
       id="rect7" />
    <text
       class="boxtext"
       x="825"
       y="196"
       id="text8">Build trash path</text>
    <text
       class="small"
       x="825"
       y="216"
       id="text9">&lt;root&gt;/&lt;trash&gt;/YYYY/MM/DD</text>
    <text
       class="small"
       x="825"
       y="234"
       id="text10">plus file name</text>
    <polygon
       class="decision"
       points="1080,145 1170,205 1080,265 990,205"
       id="polygon10" />
    <text
       class="boxtext"
       x="1080"
       y="201"
       id="text11">Trash path</text>
    <text
       class="small"
       x="1080"
       y="221"
       id="text12">exists?</text>
    <path
       class="arrow"
       d="M 285 205 H 356"
       id="path12" />
    <path
       class="arrow"
       d="M 615 205 H 691"
       id="path13" />
    <path
       class="arrow"
       d="M 950 205 H 990"
       id="path14" />
  </g>
  <g
     id="move-flow">
    <rect
       class="step"
       x="120"
       y="405"
       width="230"
       height="82"
       id="rect14" />
    <text
       class="boxtext"
       x="235"
       y="437"
       id="text14">Append UUID</text>
    <text
       class="small"
       x="235"
       y="457"
       id="text15">avoid overwriting</text>
    <text
       class="small"
       x="235"
       y="475"
       id="text16">existing trash payload</text>
    <rect
       class="step"
       x="440"
       y="405"
       width="210"
       height="82"
       id="rect16" />
    <text
       class="boxtext"
       x="545"
       y="437"
       id="text17">Move payload</text>
    <text
       class="small"
       x="545"
       y="457"
       id="text18">archive path to trash path</text>
    <rect
       class="data"
       x="740"
       y="405"
       width="250"
       height="82"
       id="rect18" />
    <text
       class="boxtext"
       x="865"
       y="437"
       id="text19">Upsert trash queue row</text>
    <text
       class="small"
       x="865"
       y="457"
       id="text20">files_to_be_removed with</text>
    <text
       class="small"
       x="865"
       y="475"
       id="text21">trash path and schedule</text>
    <rect
       class="success"
       x="440"
       y="585"
       width="320"
       height="70"
       id="rect21" />
    <text
       class="boxtext"
       x="600"
       y="614"
       id="text22">Keep physically_available true</text>
    <text
       class="small"
       x="600"
       y="636"
       id="text23">while the payload exists in trash</text>
    <path
       class="arrow"
       d="M 1080 265 C 1080 340 235 330 235 396"
       id="path23" />
    <path
       class="arrow"
       d="M 1080 265 C 1080 360 545 350 545 396"
       id="path24" />
    <path
       class="arrow"
       d="m 350,446 h 81"
       id="path25"
       sodipodi:nodetypes="cc" />
    <path
       class="arrow"
       d="M 650 446 H 731"
       id="path26" />
    <path
       class="arrow"
       d="M 865 487 C 865 555 600 545 600 576"
       id="path27" />
  </g>
  <g
     id="already-missing">
    <rect
       class="data"
       x="120"
       y="585"
       width="230"
       height="70"
       id="rect27" />
    <text
       class="boxtext"
       x="235"
       y="614"
       id="text27">Refresh physical flag</text>
    <text
       class="small"
       x="235"
       y="636"
       id="text28">from existing trash row</text>
    <path
       class="dash"
       d="m 165,265 c -196.002144,148.89793 -60.32516,221.25452 0,311"
       id="path28"
       sodipodi:nodetypes="cc" />
  </g>
  <text
     class="label"
     x="315"
     y="193"
     id="text29">yes</text>
  <text
     class="label"
     x="121.66355"
     y="272.9346"
     id="text30"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, sans-serif">no</text>
  <text
     class="label"
     x="1042"
     y="278"
     id="text31"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, sans-serif">yes</text>
  <text
     class="label"
     x="1092.9346"
     y="291.75702"
     id="text32"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, sans-serif">no</text>
</svg>
