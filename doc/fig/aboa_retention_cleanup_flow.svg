     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg24" />
  <title
     id="title">ABOA retention cleanup flow</title>
  <desc
     id="desc">High-level schematic for selecting expired archived files, dry-run behavior, and retention cleanup deletion to trash.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#5b6472"
         id="path1" />
    </marker>
    <style
       id="style1">
      .bg { fill: #f7f9fc; }
      .title { fill: #1f2937; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #5b6472; font: 400 15px Arial, sans-serif; }
      .step { fill: #ffffff; stroke: #9aa7b5; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fff8e6; stroke: #d6a84f; stroke-width: 1.5; }
      .data { fill: #eef5ff; stroke: #5b8fd6; stroke-width: 1.5; rx: 8; }
      .success { fill: #ecfdf3; stroke: #4f9d69; stroke-width: 1.5; rx: 8; }
      .failure { fill: #fff1f1; stroke: #d46a6a; stroke-width: 1.5; rx: 8; }
      .boxtext { fill: #1f2937; font: 700 15px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #374151; font: 400 13px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #5b6472; font: 700 12px Arial, sans-serif; text-anchor: middle; }
      .arrow { stroke: #5b6472; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b98a8; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect
     class="bg"
     width="1200"
     height="700"
     id="rect1" />
  <text
     class="title"
     x="60"
     y="62"
     id="text1">Retention cleanup flow</text>
  <text
     class="subtitle"
     x="60"
     y="88"
     id="text2">Expired available files can be previewed in dry-run mode or marked unavailable and moved to trash.</text>
  <g
     id="main-flow">
    <rect
       class="data"
       x="70"
       y="155"
       width="270"
       height="88"
       id="rect2" />
    <text
       class="boxtext"
       x="205"
       y="188"
       id="text3">Query expired files</text>
    <text
       class="small"
       x="205"
       y="210"
       id="text4">available is true and</text>
    <text
       class="small"
       x="205"
       y="228"
       id="text5">expiration_date &lt;= cleanup time</text>
    <polygon
       class="decision"
       points="510,142 620,199 510,256 400,199"
       id="polygon5" />
    <text
       class="boxtext"
       x="510"
       y="195"
       id="text6">Dry-run</text>
    <text
       class="small"
       x="510"
       y="215"
       id="text7">enabled?</text>
    <rect
       class="success"
       x="750"
       y="155"
       width="240"
       height="88"
       id="rect7" />
    <text
       class="boxtext"
       x="870"
       y="188"
       id="text8">Return selected rows</text>
    <text
       class="small"
       x="870"
       y="210"
       id="text9">no inventory or payload</text>
    <text
       class="small"
       x="870"
       y="228"
       id="text10">changes</text>
    <path
       class="arrow"
       d="M 340 199 H 400"
       id="path10" />
    <path
       class="arrow"
       d="M 620 199 H 741"
       id="path11" />
  </g>
  <g
     id="cleanup-flow">
    <rect
       class="data"
       x="110"
       y="410"
       width="240"
       height="92"
       id="rect11" />
    <text
       class="boxtext"
       x="230"
       y="442"
       id="text11">Mark unavailable</text>
    <text
       class="small"
       x="230"
       y="462"
       id="text12">set removal date and</text>
    <text
       class="small"
       x="230"
       y="480"
       id="text13">retention justification</text>
    <rect
       class="step"
       x="460"
       y="410"
       width="250"
       height="92"
       id="rect13" />
    <text
       class="boxtext"
       x="585"
       y="442"
       id="text14">Move payload to trash</text>
    <text
       class="small"
       x="585"
       y="462"
       id="text15">use physical deletion</text>
    <text
       class="small"
       x="585"
       y="480"
       id="text16">and trash queue flow</text>
    <rect
       class="success"
       x="820"
       y="410"
       width="240"
       height="92"
       id="rect16" />
    <text
       class="boxtext"
       x="940"
       y="442"
       id="text17">Queue final removal</text>
    <text
       class="small"
       x="940"
       y="462"
       id="text18">files_to_be_removed row</text>
    <text
       class="small"
       x="940"
       y="480"
       id="text19">keeps physical availability</text>
    <path
       class="arrow"
       d="M 510 256 C 510 330 230 330 230 401"
       id="path19" />
    <path
       class="arrow"
       d="M 350 456 H 451"
       id="path20" />
    <path
       class="arrow"
       d="M 710 456 H 811"
       id="path21" />
  </g>
  <g
     id="failure-flow">
    <rect
       class="failure"
       x="160"
       y="590"
       width="880"
       height="58"
       id="rect21" />
    <text
       class="boxtext"
       x="600"
       y="614"
       id="text21">Failure path: record RETENTION_FAILED and raise the retention cleanup error.</text>
    <path
       class="dash"
       d="M 585 502 C 585 545 520 555 500 581"
       id="path22" />
    <path
       class="dash"
       d="M 940 502 C 910 548 790 565 690 581"
       id="path23" />
  </g>
  <text
     class="label"
     x="648"
     y="187"
     id="text23">yes</text>
  <text
     class="label"
     x="488.24298"
     y="270.54205"
     id="text24"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, sans-serif">no</text>
</svg>
