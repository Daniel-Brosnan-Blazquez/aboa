[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aboa"
version = "0.2.0"
description = "Archive for Business Operations Analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
authors = [{name = "Daniel Brosnan Blázquez"}]
keywords = ["archive", "inventory", "postgresql", "retention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving",
]
dependencies = [
    "sqlalchemy==1.3.22",
    "psycopg2-binary==2.9.11",
    "python-dateutil==2.9.0.post0",
    "lxml==6.0.2",
]

[project.optional-dependencies]
tests = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.urls]
Homepage = "https://github.com/Daniel-Brosnan-Blazquez/aboa"
Repository = "https://github.com/Daniel-Brosnan-Blazquez/aboa"
Issues = "https://github.com/Daniel-Brosnan-Blazquez/aboa/issues"

[project.scripts]
"aboa_init.py" = "aboa.scripts.aboa_init:main"
"aboa_archive.py" = "aboa.scripts.aboa_archive:main"
"aboa_retrieve.py" = "aboa.scripts.aboa_retrieve:main"
"aboa_delete.py" = "aboa.scripts.aboa_delete:main"
"aboa_recover.py" = "aboa.scripts.aboa_recover:main"
"aboa_clean_up.py" = "aboa.scripts.aboa_clean_up:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["aboa", "aboa.*"]
namespaces = false

[tool.setuptools.package-data]
aboa = ["config/*.json", "config/*.xml", "schemas/*.xsd"]
"aboa.datamodel" = ["*.sql"]
"aboa.scripts" = ["*.sh"]
